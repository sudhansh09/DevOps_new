apiVersion: v1
kind: Namespace
metadata:
  name: egov-system
  labels:
    tier: production
    managed-by: gitlab-ci
    governance-domain: citizen-services
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: egov-system-quota
  namespace: egov-system
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
