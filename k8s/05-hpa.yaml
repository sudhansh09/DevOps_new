apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: egov-portal-hpa
  namespace: egov-system
  labels:
    app: egov-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: egov-citizen-portal
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
